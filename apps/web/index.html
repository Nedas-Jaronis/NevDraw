<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>NevDraw</title>
    <script>
      // Resolve the theme before first paint (no flash): saved choice, else the system setting.
      ;(() => {
        let pref = "system"
        try { pref = localStorage.getItem("rtw.theme") || "system" } catch {}
        const dark = pref === "dark" || (pref !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.dataset.theme = dark ? "dark" : "light"
        document.documentElement.style.colorScheme = dark ? "dark" : "light"
      })()
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect x=%274%27 y=%276%27 width=%2724%27 height=%2720%27 rx=%274%27 fill=%27none%27 stroke=%27%23e11d48%27 stroke-width=%273%27 stroke-dasharray=%275 3%27/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
