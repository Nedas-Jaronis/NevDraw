# Fly.io: one always-on machine (rooms live in memory, so never scale past one) with a disk for boards.
#   fly launch --copy-config --no-deploy   # pick the app name; keep this file
#   fly volumes create nevdraw_data --size 1
#   fly secrets set TYPESAFE_API_KEY=... GPTOSS_API_KEY=...
#   fly deploy
app = "nevdraw"
primary_region = "mia"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "nevdraw_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
